<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naya Design</title>
    <style>
        /* Naya Modern CSS Design */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f2f5; 
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }
        
        .navbar {
            background-color: #00897b; 
            padding: 15px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .navbar h2 { 
            margin: 0; 
            color: white; 
            font-size: 22px;
        }
        
        .navbar a { 
            color: white; 
            text-decoration: none; 
            margin-left: 20px; 
            font-weight: 500;
            transition: opacity 0.3s;
        }
        
        .navbar a:hover {
            opacity: 0.8;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            margin: 50px auto;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        h2, h3 { 
            color: #2c3e50; 
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #444;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            background-color: #f9f9f9;
            color: #000000;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #00897b;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .checkbox-group input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            background-color: #00897b;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #00695c;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }

        ul { 
            padding-left: 0; 
        }
        
        li {
            background-color: #f9f9f9;
            color: #333;
            padding: 15px;
            margin-bottom: 10px;
            list-style-type: none;
            border-left: 4px solid #00897b;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .emergency-text {
            color: #d32f2f; 
            font-weight: bold;
            background: #ffebee;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>Clinic Management System</h2>
        <div>
            <a href="#">Dashboard</a>
            <a href="#">Tokens</a>
        </div>
    </div>

    <div class="container">
        <h2>Token Management</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <label for="patient_name">Patient Name:</label>
            <input type="text" id="patient_name" name="patient_name" required placeholder="Enter patient full name">
            
            <div class="checkbox-group">
                <input type="checkbox" name="is_emergency" id="emg">
                <label for="emg" style="color: #d32f2f !important; margin-bottom: 0; cursor: pointer;">
                    Emergency Patient (Priority)
                </label>
            </div>
            
            <button type="submit">+ Generate Token</button>
        </form>

        <hr>
        
        <h3>Today's Tokens:</h3>
        <ul>
            {% for p in patients %}
                <li>
                    <div>
                        <b>{{ p.name }}</b> 
                        <span style="color: #666; font-size: 14px; margin-left: 10px;">Token: {{ p.token }}</span>
                    </div>
                    {% if p.emergency %} 
                        <span class="emergency-text">EMERGENCY</span> 
                    {% endif %}
                </li>
            {% empty %}
                <li style="justify-content: center; color: #888 !important;">
                    <i>No patients added yet.</i>
                </li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
