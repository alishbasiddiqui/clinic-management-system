<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Clinic Management System{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3f6fa;
            --card: #fff;
            --ink: #172b3a;
            --muted: #647789;
            --brand: #126b68;
            --brand-dark: #0c504e;
            --line: #dce5eb;
            --red: #b42332;
            --green: #237a52;
            --amber: #996200;
            --shadow: 0 8px 24px rgba(22, 49, 66, .06);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
        header { min-height: 68px; padding: 14px max(20px, calc((100% - 1120px) / 2)); background: #103f4b; color: #fff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px 24px; }
        header h1 { margin: 0; font-size: 1.08rem; letter-spacing: .01em; }
        header a { color: #d7f0ed; text-decoration: none; margin-left: 18px; }
        header a:hover, a:hover { text-decoration: underline; }
        main { max-width: 1120px; margin: 32px auto; padding: 0 22px 40px; }
        h2 { margin: 0 0 16px; font-size: 1.15rem; letter-spacing: -.01em; }
        .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 4px 0 22px; }
        .page-heading h2 { margin: 0; font-size: 1.65rem; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow); }
        table { width: 100%; border-collapse: collapse; }
        .table-wrap { overflow-x: auto; }
        th, td { text-align: left; padding: 12px 13px; border-bottom: 1px solid var(--line); font-size: .94rem; vertical-align: middle; }
        th { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .045em; }
        tr:last-child td { border-bottom: 0; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
        .Emergency { background: #fdebed; color: var(--red); }
        .Normal { background: #e8f2f6; color: #26607c; }
        .st-Waiting { background: #fff3da; color: var(--amber); }
        .st-InConsultation { background: #e7f2f5; color: #23657a; }
        .st-Completed { background: #e6f4ec; color: var(--green); }
        label { display: block; margin: 14px 0 6px; font-size: .9rem; font-weight: 650; }
        input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #cbd8e0; border-radius: 8px; background: #fff; color: var(--ink); font: inherit; }
        input:focus, select:focus, textarea:focus { outline: 3px solid rgba(18, 107, 104, .15); border-color: var(--brand); }
        button, .btn { background: var(--brand); color: #fff; border: 0; padding: 10px 17px; border-radius: 8px; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; display: inline-block; }
        button:hover, .btn:hover { background: var(--brand-dark); text-decoration: none; }
        button.green { background: var(--green); }
        .secondary-link { color: var(--brand-dark); font-weight: 650; }
        .msg { padding: 12px 15px; border-radius: 9px; margin-bottom: 14px; }
        .msg.success { background: #e6f4ec; color: var(--green); }
        .msg.error { background: #fdebed; color: var(--red); }
        .muted { color: var(--muted); }
        dl { display: grid; grid-template-columns: minmax(125px, 180px) 1fr; gap: 9px 16px; margin: 0; }
        dt { color: var(--muted); }
        dd { margin: 0; overflow-wrap: anywhere; }
        .alert { background: #fdebed; color: var(--red); padding: 13px 16px; border-radius: 9px; font-weight: 700; margin-bottom: 16px; }
        .form-errors { color: var(--red); margin: 5px 0 0; font-size: .88rem; }
        .form-actions { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
        @media (max-width: 640px) {
            header { padding: 14px 18px; }
            header a { margin-left: 12px; }
            main { margin-top: 22px; padding: 0 14px 28px; }
            .card { padding: 17px; }
            .page-heading { align-items: flex-start; flex-direction: column; }
            .page-heading h2 { font-size: 1.4rem; }
            dl { grid-template-columns: 1fr; gap: 3px; }
            dd { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
<header>
    <h1>Clinic Management System</h1>
    {% if doctor_name %}
    <nav aria-label="Main navigation">
        <span>{{ doctor_name }}</span>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'register_patient' %}">Register patient</a>
        <a href="{% url 'logout_doctor' %}">Switch doctor</a>
    </nav>
    {% endif %}
</header>
<main>
    {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
