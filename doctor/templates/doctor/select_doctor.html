{% extends "doctor/base.html" %}
{% block title %}Doctor Login{% endblock %}
{% block content %}
<div class="card">
    <h2>Doctor Module</h2>
    <form method="post">
        {% csrf_token %}
        <label for="doctor">Select doctor</label>
        <select name="doctor" id="doctor">
            {% for d in doctors %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
        </select>
        <p><button type="submit">Continue</button></p>
    </form>
    {% if not doctors %}
        <p class="muted">No patients yet. Run <code>python manage.py seed_patients</code> or add patients in the admin.</p>
    {% endif %}
</div>
{% endblock %}
