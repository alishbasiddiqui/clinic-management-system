name: Clinic Management CI/CD

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: clinic-ci-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-readiness:
    name: Development / Staging readiness (CI only)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify migration files
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to CI database
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python manage.py test

      # Hosting has not been selected. This workflow intentionally has no deploy job.
