name: Clinic Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clinic-ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-readiness:
    name: Main / Production readiness (CI only)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Django dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==6.1.2"

      - name: Django system checks
        run: python manage.py check

      - name: Verify migration files
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to CI database
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python manage.py test

      # Hosting has not been selected. This workflow intentionally has no deploy job.
